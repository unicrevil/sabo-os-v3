# ============================================================
# SABO OS v3 — GitHub Actions CI
# Compila, testa e exibe benchmark a cada push/PR
# ============================================================

name: SABO OS v3 CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=native"

jobs:

  # ──────────────────────────────────────────
  # Job 1: Build + Test
  # ──────────────────────────────────────────
  build-and-test:
    name: Build & Test (nightly)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🦀 Instalar Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: 📦 Cache de dependências Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 🔨 Compilar (release)
        run: cargo +nightly build --release --verbose

      - name: ✅ Rodar testes
        run: cargo +nightly test --verbose

      - name: 🎨 Verificar formatação
        run: cargo +nightly fmt --check

      - name: 🔍 Clippy (lint)
        run: cargo +nightly clippy -- -D warnings

  # ──────────────────────────────────────────
  # Job 2: Benchmark (só no push, não em PR)
  # ──────────────────────────────────────────
  benchmark:
    name: 🚀 Benchmark Demo
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🦀 Instalar Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: 📦 Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: ⚡ Rodar SABO OS v3
        run: |
          cargo +nightly build --release
          ./target/release/sabo_os_v3
          
